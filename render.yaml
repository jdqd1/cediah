databases:
  # Temporary rollback source. The API no longer reads this database after
  # the Supabase cutover; keep it intact until production verification ends.
  - name: cediah-postgres
    plan: free

services:
  - type: web
    name: cediah-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WEB_ORIGINS
        value: https://koraz-app.vercel.app,https://cediah.vercel.app
      - key: DATABASE_URL
        # Supabase's pooled connection string is managed in Render and must
        # never be committed to this Blueprint.
        sync: false
      - key: DATABASE_MIGRATIONS_ENABLED
        # The free Supabase IPv4 endpoint uses transaction pooling. Apply SQL
        # migrations separately because the migrator takes a session lock.
        value: "false"
      - key: BETTER_AUTH_URL
        value: https://koraz-app.vercel.app
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # Use server-side S3 access keys from Supabase Storage. These keys must
      # never be exposed through NEXT_PUBLIC_* variables.
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_FORCE_PATH_STYLE
        value: "true"
      - key: CONTENT_STORAGE_BUCKET
        value: content-assets
      - key: VIDEO_STORAGE_BUCKET
        value: video-test
      - key: VIDEO_TEST_UPLOAD_ENABLED
        # Keep optional video uploads off until all S3 credentials are set.
        # Authentication and the rest of the API must still be able to start.
        value: "false"
      - key: VIDEO_TEST_PROVIDER
        value: s3
      - key: VIDEO_TEST_UPLOADER_IDS
        sync: false
      - key: VIDEO_TEST_MAX_DURATION_SECONDS
        value: "900"
      - key: VIDEO_TEST_MAX_FILE_BYTES
        value: "50000000"
