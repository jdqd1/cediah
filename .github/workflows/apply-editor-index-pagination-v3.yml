name: Finalize editorial index pagination

on:
  push:
    branches:
      - fix/editorial-index-pagination

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cediah:cediah@127.0.0.1:5432/cediah_test
      MIGRATIONS_PATH: ${{ github.workspace }}/database/migrations
      WEB_ORIGIN: http://localhost:3000
      API_BASE_URL: http://localhost:4000
      VIDEO_TEST_PROVIDER: disabled
      GUIDED_LEARNING_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cediah
          POSTGRES_PASSWORD: cediah
          POSTGRES_DB: cediah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cediah -d cediah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply integration patch
        run: |
          node --check .tmp/apply-editor-index-pagination.mjs
          node .tmp/apply-editor-index-pagination.mjs
          node .tmp/fix-editor-index-typecheck.mjs
          git rm .tmp/apply-editor-index-pagination.mjs
          git rm .tmp/fix-editor-index-typecheck.mjs
          git rm .github/workflows/apply-editor-index-pagination.yml
          git rm .github/workflows/apply-editor-index-pagination-v2.yml
          git rm .github/workflows/apply-editor-index-pagination-v3.yml
          git add -A
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cediah/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - name: Commit validated fix
        run: |
          git commit -m "Fix editorial index pagination and counts"
          git push origin HEAD:${{ github.ref_name }}
