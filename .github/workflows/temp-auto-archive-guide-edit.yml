name: Temporary auto-archive guide edit patch

on:
  push:
    branches:
      - fix/auto-archive-guide-on-edit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch guide editor launch behavior
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-auto-archive-guide-edit.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/content-studio.tsx .github/workflows/temp-auto-archive-guide-edit.yml
          git commit -m "fix: archivar guías automáticamente al editarlas"
          git push origin HEAD:fix/auto-archive-guide-on-edit
