name: Apply robust Markdown highlight fix

on:
  push:
    branches:
      - fix/markdown-highlight-recognition

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/markdown-highlight-recognition
      - name: Patch highlight recognition
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          rm .github/workflows/apply-markdown-highlight-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Markdown highlight recognition across guide flows'
          git push origin HEAD:fix/markdown-highlight-recognition
