name: Temporary inner guide auto-archive patch

on:
  push:
    branches:
      - fix/auto-archive-inner-guide-edit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch published guide edit flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base_path = Path("apps/web/src/components/guide-editor-screen-base.tsx")
          base = base_path.read_text()

          base = base.replace(
              '  onLeave,\n  onSave,\n  status = "draft",',
              '  onLeave,\n  onPrepareEdit,\n  onSave,\n  status = "draft",',
              1,
          )
          base = base.replace(
              '  onDismissNotice: () => void;\n  onSave: () => Promise<boolean>;',
              '  onDismissNotice: () => void;\n  onPrepareEdit: () => Promise<boolean>;\n  onSave: () => Promise<boolean>;',
              1,
          )
          base = base.replace(
              '"Archiva la guía antes de editarla"',
              '"Editar guía (se archivará automáticamente)"',
              1,
          )

          marker = 'text: status === "published"'
          marker_index = base.index(marker)
          click_start = base.rfind('              onClick={() => {', 0, marker_index)
          click_end = base.index('              }}', marker_index) + len('              }}')
          replacement = '''              onClick={() => {
                void (async () => {
                  if (status === "published") {
                    const ready = await onPrepareEdit();
                    if (!ready) return;
                  } else if (!canEditDocument) {
                    setInteractionNotice({
                      text: "No puedes editar esta guía con los permisos actuales. Para solucionarlo, pide a coordinación o administración que te asigne acceso de edición.",
                      tone: "warning",
                    });
                    return;
                  }
                  setInteractionNotice(null);
                  setEditMode(true);
                  editor?.setEditable(true);
                  window.requestAnimationFrame(() => editor?.commands.focus("end"));
                })();
              }}'''
          base = base[:click_start] + replacement + base[click_end:]
          base_path.write_text(base)

          studio_path = Path("apps/web/src/components/content-studio.tsx")
          studio = studio_path.read_text()
          anchor = '  async function removeContent() {\n'
          function = '''  async function prepareGuideEdit(): Promise<boolean> {
            if (!item || item.kind !== "guide") return false;
            if (item.status !== "published") return true;
            if (!capabilities.canPublish || busy) {
              setNotice({
                text: "No puedes editar esta guía publicada porque tu cuenta no tiene permiso para archivarla.",
                tone: "error",
              });
              return false;
            }

            setBusy("transition");
            setNotice(null);
            try {
              const current = await contentItemJson(
                `/api/editor/content/${encodeURIComponent(item.id)}/transition`,
                { body: JSON.stringify({ status: "archived" }), method: "POST" },
              );
              if (current.kind !== "guide" || current.status !== "archived") {
                throw new Error(errors.content_unavailable);
              }
              upsert(current);
              setNotice({
                text: "Guía archivada automáticamente para editarla.",
                tone: "success",
              });
              return true;
            } catch (error) {
              setNotice({
                text: error instanceof Error
                  ? error.message
                  : "No se pudo archivar la guía automáticamente antes de editarla.",
                tone: "error",
              });
              return false;
            } finally {
              setBusy(null);
            }
          }

          '''
          if anchor not in studio:
              raise SystemExit("content-studio removeContent anchor not found")
          studio = studio.replace(anchor, function + anchor, 1)
          studio = studio.replace(
              '          onLeave={leaveGuideEditor}\n          onSave={() => save()}',
              '          onLeave={leaveGuideEditor}\n          onPrepareEdit={prepareGuideEdit}\n          onSave={() => save()}',
              1,
          )
          studio_path.write_text(studio)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-auto-archive-inner-guide-edit.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/guide-editor-screen-base.tsx apps/web/src/components/content-studio.tsx .github/workflows/temp-auto-archive-inner-guide-edit.yml
          git commit -m "fix: autoarchivar guía al pulsar Editar"
          git push origin HEAD:fix/auto-archive-inner-guide-edit
