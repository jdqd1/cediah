name: Apply key-point study sync

on:
  push:
    branches:
      - fix/key-points-study-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/key-points-study-sync
      - name: Patch editor and reader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          editor_path = Path('apps/web/src/components/guide-editor-screen.tsx')
          editor = editor_path.read_text()

          old = '''} from "@/lib/guide-document";
          import {
            markdownHighlightInputMatch,
          '''
          new = '''} from "@/lib/guide-document";
          import {
            appendDiscoveredGuideKeyPoints,
            extractGuideKeyPoints,
          } from "@/lib/guide-key-points";
          import {
            markdownHighlightInputMatch,
          '''
          assert old in editor, 'guide editor import anchor not found'
          editor = editor.replace(old, new, 1)

          old = '''      let next = withDocument(currentDraft, parsed.data);
                if (currentDraft.kind === "guide") {
          '''
          new = '''      let next = withDocument(currentDraft, parsed.data);
                next = withKeyPoints(
                  next,
                  appendDiscoveredGuideKeyPoints(
                    guideKeyPoints(currentDraft),
                    extractGuideKeyPoints(parsed.data),
                  ),
                );
                if (currentDraft.kind === "guide") {
          '''
          assert old in editor, 'guide editor onUpdate anchor not found'
          editor = editor.replace(old, new, 1)
          editor_path.write_text(editor)

          reader_path = Path('apps/web/src/components/content-detail-screen.tsx')
          reader = reader_path.read_text()

          old = '''import { extractGuideOutline, numberGuideOutline, sectionsToRichTextDocument } from "@/lib/guide-document";
          import { normalizeMarkdownHighlights } from "@/lib/guide-markdown";
          '''
          new = '''import { extractGuideOutline, numberGuideOutline, sectionsToRichTextDocument } from "@/lib/guide-document";
          import {
            extractGuideKeyPoints,
            isGuideKeyPointLinked,
            mergeGuideKeyPoints,
          } from "@/lib/guide-key-points";
          import { normalizeMarkdownHighlights } from "@/lib/guide-markdown";
          '''
          assert old in reader, 'reader import anchor not found'
          reader = reader.replace(old, new, 1)

          old = '''  const outline = useMemo(() => extractGuideOutline(guideDocument), [guideDocument]);
            const numberedOutline = useMemo(() => numberGuideOutline(outline), [outline]);
          '''
          new = '''  const outline = useMemo(() => extractGuideOutline(guideDocument), [guideDocument]);
            const numberedOutline = useMemo(() => numberGuideOutline(outline), [outline]);
            const studyKeyPoints = useMemo(
              () => mergeGuideKeyPoints(content.keyPoints, extractGuideKeyPoints(guideDocument)),
              [content.keyPoints, guideDocument],
            );
          '''
          assert old in reader, 'reader memo anchor not found'
          reader = reader.replace(old, new, 1)

          old = '''                count={content.keyPoints.length}
          '''
          assert old in reader, 'reader key point count anchor not found'
          reader = reader.replace(old, '''                count={studyKeyPoints.length}
          ''', 1)

          old = '''                {content.keyPoints.length > 0 ? (
                            <ul className="published-rich-guide-key-points">
                              {content.keyPoints.map((point, index) => (
                                <li key={`${point}-${index}`}>
                                  <Lightbulb aria-hidden="true" size={17} />
                                  <span>{point}</span>
                                  <button
                                    aria-label={`Ir al fragmento relacionado con el punto clave ${index + 1}`}
                                    title="Ver en el texto de la guía"
                                    type="button"
                                    onClick={() => goToKeyPoint(point)}
                                  >
                                    <ArrowRight aria-hidden="true" size={14} />
                                  </button>
                                </li>
                              ))}
                            </ul>
                          ) : (
          '''
          new = '''                {studyKeyPoints.length > 0 ? (
                            <ul className="published-rich-guide-key-points">
                              {studyKeyPoints.map((point, index) => {
                                const linked = isGuideKeyPointLinked(guideDocument, point);
                                return (
                                  <li key={`${point}-${index}`}>
                                    <Lightbulb aria-hidden="true" size={17} />
                                    <span>{point}</span>
                                    {linked ? (
                                      <button
                                        aria-label={`Ir al fragmento relacionado con el punto clave ${index + 1}`}
                                        title="Ver en el texto de la guía"
                                        type="button"
                                        onClick={() => goToKeyPoint(point)}
                                      >
                                        <ArrowRight aria-hidden="true" size={14} />
                                      </button>
                                    ) : null}
                                  </li>
                                );
                              })}
                            </ul>
                          ) : (
          '''
          assert old in reader, 'reader key point list anchor not found'
          reader = reader.replace(old, new, 1)
          reader_path.write_text(reader)

          workflow = Path('.github/workflows/apply-key-point-study-sync.yml')
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/guide-editor-screen.tsx apps/web/src/components/content-detail-screen.tsx .github/workflows/apply-key-point-study-sync.yml
          git commit -m "Sync document key points with study resources"
          git push origin HEAD:fix/key-points-study-sync
